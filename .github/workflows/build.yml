name: Windows Build (Portable)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
    # 1. Récupération du code
    - uses: actions/checkout@v4

    # 2. Installation de Python
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 3. Installation de Qt 6.8 ET des Sources
    - name: Install Qt & Sources via aqtinstall
      shell: pwsh
      run: |
        pip install aqtinstall
        aqt install-qt windows desktop 6.8.0 win64_msvc2022_64 -m qtwebsockets --outputdir c:\qt
        aqt install-src windows desktop 6.8.0 --outputdir c:\qt

    # 4. Téléchargement des librairies MariaDB
    - name: Download MariaDB Connector C
      shell: pwsh
      run: |
        $url = "https://downloads.mariadb.com/Connectors/c/connector-c-3.3.8/mariadb-connector-c-3.3.8-win64.msi"
        Invoke-WebRequest -Uri $url -OutFile mariadb.msi
        Start-Process msiexec.exe -ArgumentList '/i', 'mariadb.msi', '/quiet', '/norestart' -NoNewWindow -Wait
        
        New-Item -ItemType Directory -Force -Path "C:\mysql_libs"
        
        # Debug : lister le contenu installé
        Write-Host "=== Listing MariaDB install ==="
        Get-ChildItem -Recurse "C:\Program Files\MariaDB" | Select-Object FullName
        
        # Copie lib
        $libPath = "C:\Program Files\MariaDB\MariaDB Connector C 64-bit\lib\libmariadb.lib"
        if (Test-Path $libPath) {
            Copy-Item $libPath "C:\mysql_libs\"
            Write-Host "SUCCESS: libmariadb.lib found and copied."
        } else {
            Write-Error "FATAL: libmariadb.lib not found!"
            exit 1
        }
        
        Copy-Item "C:\Program Files\MariaDB\MariaDB Connector C 64-bit\lib\libmariadb.dll" "C:\mysql_libs\"
        
        # Copie include — on prend TOUT le dossier include
        Copy-Item -Recurse "C:\Program Files\MariaDB\MariaDB Connector C 64-bit\include" "C:\mysql_libs\"
        
        # Debug : vérifier que mysql.h est trouvable
        Write-Host "=== Searching for mysql.h ==="
        Get-ChildItem -Recurse "C:\mysql_libs\include" -Filter "mysql.h" | Select-Object FullName

    # 5. Compilation du Plugin QMYSQL
    - name: Compile QMYSQL Plugin
      shell: cmd
      env:
        QT_PATH: C:\qt\6.8.0\msvc2022_64
        SRC_PATH: C:\qt\6.8.0\Src
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        
        mkdir build-sqldrivers
        cd build-sqldrivers
        
        :: Trouver le bon chemin include (mariadb/ sous-dossier ou racine)
        if exist "C:\mysql_libs\include\mariadb\mysql.h" (
            set "MYSQL_INC=C:\mysql_libs\include\mariadb"
            echo "Using include path: C:\mysql_libs\include\mariadb"
        ) else if exist "C:\mysql_libs\include\mysql.h" (
            set "MYSQL_INC=C:\mysql_libs\include"
            echo "Using include path: C:\mysql_libs\include"
        ) else (
            echo "FATAL: mysql.h not found anywhere in C:\mysql_libs\include"
            dir /s /b C:\mysql_libs\
            exit /b 1
        )
        
        %QT_PATH%\bin\qt-cmake.bat "%SRC_PATH%\qtbase\src\plugins\sqldrivers" ^
          -G "Ninja" ^
          -DFEATURE_sql_mysql=ON ^
          -DMySQL_INCLUDE_DIR="%MYSQL_INC%" ^
          -DMySQL_LIBRARY="C:\mysql_libs\libmariadb.lib"
        
        :: Vérifier que cmake a bien activé MySQL
        echo "=== CMake Cache check ==="
        findstr /i "mysql" CMakeCache.txt
        
        :: Compilation
        cmake --build . --verbose
        
        :: Vérification stricte que le plugin existe
        echo "=== All generated DLLs ==="
        dir /s /b *.dll
        
        where /r . qsqlmysql.dll
        if errorlevel 1 (
            echo "FATAL: qsqlmysql.dll was NOT compiled!"
            echo "=== Full build directory listing ==="
            dir /s /b .
            exit /b 1
        )
        
        echo "SUCCESS: qsqlmysql.dll found."

    # 6. Compilation de l'application
    - name: Build Application
      shell: cmd
      env:
        QT_PATH: C:\qt\6.8.0\msvc2022_64
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        set PATH=%QT_PATH%\bin;%PATH%
        
        mkdir build
        cd build
        
        qmake ..\LiveBridge.pro "CONFIG+=release"
        nmake

    # 7. Déploiement
    - name: Package Application
      shell: pwsh
      env:
        QT_BIN: C:\qt\6.8.0\msvc2022_64\bin
      run: |
        New-Item -ItemType Directory -Force -Path "ReleasePack"
        
        # 1. Copie App & DLL MariaDB
        Copy-Item "build\release\LiveBridge.exe" "ReleasePack\"
        Copy-Item "C:\mysql_libs\libmariadb.dll" "ReleasePack\"
        
        # 2. Windeployqt
        & "$env:QT_BIN\windeployqt.exe" --dir "ReleasePack" --plugindir "ReleasePack\plugins" --no-translations --compiler-runtime "ReleasePack\LiveBridge.exe"
        
        # 3. Copie du plugin QMYSQL compilé (écrase celui par défaut si existant)
        Write-Host "=== Searching for qsqlmysql.dll ==="
        $plugin = Get-ChildItem -Path "build-sqldrivers" -Filter "qsqlmysql.dll" -Recurse | Select-Object -First 1
        
        if ($plugin) {
            Write-Host "FOUND PLUGIN at: $($plugin.FullName)"
            $targetDir = "ReleasePack\plugins\sqldrivers"
            if (-not (Test-Path $targetDir)) {
                New-Item -ItemType Directory -Force -Path $targetDir
            }
            Copy-Item $plugin.FullName "$targetDir\" -Force
            Write-Host "Plugin copied to $targetDir"
        } else {
            Write-Error "CRITICAL: qsqlmysql.dll not found in build-sqldrivers!"
            Get-ChildItem -Path "build-sqldrivers" -Recurse
            exit 1
        }
        
        # 4. Vérification finale du contenu
        Write-Host "=== Final ReleasePack contents ==="
        Get-ChildItem -Recurse "ReleasePack" | Select-Object FullName

    # 8. Upload
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LiveBridge-Portable-Windows
        path: ReleasePack