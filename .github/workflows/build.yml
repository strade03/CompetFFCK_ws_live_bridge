name: Windows Build (Portable)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
    # 1. Récupération du code
    - uses: actions/checkout@v4

    # 2. Installation de Python
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 3. Installation de Qt 6.8 ET des Sources via aqtinstall
    - name: Install Qt & Sources via aqtinstall
      shell: pwsh
      run: |
        pip install aqtinstall
        aqt install-qt windows desktop 6.8.0 win64_msvc2022_64 -m qtwebsockets --outputdir c:\qt
        aqt install-src windows desktop 6.8.0 --outputdir c:\qt

    # 4. Téléchargement des librairies MariaDB
    - name: Download MariaDB Connector C
      shell: pwsh
      run: |
        $url = "https://downloads.mariadb.com/Connectors/c/connector-c-3.3.8/mariadb-connector-c-3.3.8-win64.msi"
        Invoke-WebRequest -Uri $url -OutFile mariadb.msi
        Start-Process msiexec.exe -ArgumentList '/i', 'mariadb.msi', '/quiet', '/norestart' -NoNewWindow -Wait
        
        New-Item -ItemType Directory -Force -Path "C:\mysql_libs"
        Copy-Item "C:\Program Files\MariaDB\MariaDB Connector C 64-bit\lib\libmariadb.lib" "C:\mysql_libs\"
        Copy-Item "C:\Program Files\MariaDB\MariaDB Connector C 64-bit\lib\libmariadb.dll" "C:\mysql_libs\"
        Copy-Item -Recurse "C:\Program Files\MariaDB\MariaDB Connector C 64-bit\include" "C:\mysql_libs\"

    # 5. Compilation du Plugin QMYSQL
    - name: Compile QMYSQL Plugin
      shell: cmd
      env:
        QT_PATH: C:\qt\6.8.0\msvc2022_64
        SRC_PATH: C:\qt\6.8.0\Src
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        
        mkdir build-sqldrivers
        cd build-sqldrivers
        
        :: Configuration
        %QT_PATH%\bin\qt-cmake.bat "%SRC_PATH%\qtbase\src\plugins\sqldrivers" ^
          -G "Ninja" ^
          -DCMAKE_INSTALL_PREFIX="%QT_PATH%" ^
          -DMySQL_INCLUDE_DIR="C:\mysql_libs\include" ^
          -DMySQL_LIBRARY="C:\mysql_libs\libmariadb.lib"
        
        :: Compilation
        cmake --build . --target qsqlmysql
        
        :: Note: On ne fait pas d'install ici pour éviter les erreurs de chemin, 
        :: on copiera le fichier manuellement à l'étape 7.
        echo "Plugin compiled!"

    # 6. Compilation de TON application
    - name: Build Application
      shell: cmd
      env:
        QT_PATH: C:\qt\6.8.0\msvc2022_64
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        set PATH=%QT_PATH%\bin;%PATH%
        
        mkdir build
        cd build
        
        qmake ..\LiveBridge.pro "CONFIG+=release"
        nmake

    # 7. Déploiement (CORRIGÉ : Récupération directe du plugin compilé)
    - name: Package Application
      shell: pwsh
      env:
        QT_BIN: C:\qt\6.8.0\msvc2022_64\bin
      run: |
        New-Item -ItemType Directory -Force -Path "ReleasePack"
        
        # 1. Copie de l'application
        Copy-Item "build\release\LiveBridge.exe" "ReleasePack\"
        
        # 2. Copie de la lib MariaDB (dépendance du plugin)
        Copy-Item "C:\mysql_libs\libmariadb.dll" "ReleasePack\"
        
        # 3. Windeployqt (Copie les DLLs Qt standards)
        $windeploy = "$env:QT_BIN\windeployqt.exe"
        & $windeploy --dir "ReleasePack" --plugindir "ReleasePack\plugins" --no-translations --compiler-runtime "ReleasePack\LiveBridge.exe"
        
        # 4. COPIE MANUELLE DU PLUGIN MYSQL (La partie critique)
        # On va le chercher directement là où il a été compilé (build-sqldrivers)
        $pluginSrc = "build-sqldrivers\plugins\sqldrivers\qsqlmysql.dll"
        
        if (Test-Path $pluginSrc) {
            Write-Host "Found compiled plugin at $pluginSrc"
            Copy-Item $pluginSrc "ReleasePack\plugins\sqldrivers\"
        } else {
            Write-Host "ERROR: Compiled plugin not found at $pluginSrc"
            # Tentative de recherche récursive si le chemin diffère légèrement
            $found = Get-ChildItem -Path "build-sqldrivers" -Filter "qsqlmysql.dll" -Recurse | Select-Object -First 1
            if ($found) {
                 Write-Host "Found via search at $($found.FullName)"
                 Copy-Item $found.FullName "ReleasePack\plugins\sqldrivers\"
            } else {
                 Write-Error "CRITICAL: Could not find qsqlmysql.dll anywhere in build-sqldrivers!"
                 exit 1
            }
        }

    # 8. Upload
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LiveBridge-Portable-Windows
        path: ReleasePack