name: Windows Build (Portable)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Qt & Sources via aqtinstall
      shell: pwsh
      run: |
        pip install aqtinstall
        aqt install-qt windows desktop 6.8.0 win64_msvc2022_64 -m qtwebsockets --outputdir c:\qt
        aqt install-src windows desktop 6.8.0 --outputdir c:\qt

    - name: Download MariaDB Connector C
      shell: pwsh
      run: |
        # $url = "https://downloads.mariadb.com/Connectors/c/connector-c-3.3.8/mariadb-connector-c-3.3.8-win64.msi"
        $url = "https://dlm.mariadb.com/3677132/Connectors/c/connector-c-3.3.8/mariadb-connector-c-3.3.8-win64.msi"
        Invoke-WebRequest -Uri $url -OutFile mariadb.msi
        Start-Process msiexec.exe -ArgumentList '/i', 'mariadb.msi', '/quiet', '/norestart' -NoNewWindow -Wait
        
        New-Item -ItemType Directory -Force -Path "C:\mysql_libs\include"
        
        Copy-Item "C:\Program Files\MariaDB\MariaDB Connector C 64-bit\lib\libmariadb.lib" "C:\mysql_libs\"
        Copy-Item "C:\Program Files\MariaDB\MariaDB Connector C 64-bit\lib\libmariadb.dll" "C:\mysql_libs\"
        
        # Copie tous les headers à plat
        Copy-Item "C:\Program Files\MariaDB\MariaDB Connector C 64-bit\include\*.h" "C:\mysql_libs\include\"
        Get-ChildItem "C:\Program Files\MariaDB\MariaDB Connector C 64-bit\include" -Directory | ForEach-Object {
            Copy-Item "$($_.FullName)\*.h" "C:\mysql_libs\include\" -ErrorAction SilentlyContinue
        }
        
        Write-Host "=== Verifying mysql.h ==="
        if (-not (Test-Path "C:\mysql_libs\include\mysql.h")) {
            Write-Error "FATAL: mysql.h not found"
            exit 1
        }
        Get-ChildItem "C:\mysql_libs" -Recurse | Select-Object FullName

    - name: Compile QMYSQL Plugin
      shell: pwsh
      env:
        QT_PATH: C:\qt\6.8.0\msvc2022_64
        SRC_PATH: C:\qt\6.8.0\Src
      run: |
        # Charger l'environnement MSVC
        Import-Module "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
        Enter-VsDevShell -VsInstallPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" -DevCmdArguments "-arch=x64" -SkipAutomaticLocation
        
        # Vérifier que le source du plugin MySQL existe
        $mysqlPluginSrc = "$env:SRC_PATH\qtbase\src\plugins\sqldrivers"
        Write-Host "=== SQL drivers source ==="
        Get-ChildItem $mysqlPluginSrc
        
        if (Test-Path "$mysqlPluginSrc\mysql") {
            Write-Host "MySQL plugin source directory found"
            Get-ChildItem "$mysqlPluginSrc\mysql"
        } else {
            Write-Error "FATAL: No mysql subdirectory in sqldrivers source!"
            Get-ChildItem $mysqlPluginSrc -Recurse
            exit 1
        }
        
        # Configurer
        New-Item -ItemType Directory -Force -Path "build-sqldrivers"
        Set-Location "build-sqldrivers"
        
        Write-Host "=== Running qt-cmake ==="
        & "$env:QT_PATH\bin\qt-cmake.bat" "$mysqlPluginSrc" `
          -G "Ninja" `
          -DCMAKE_INSTALL_PREFIX="$env:QT_PATH" `
          -DFEATURE_sql_mysql=ON `
          -DFEATURE_sql_mimer=OFF `
          -DFEATURE_sql_psql=OFF `
          -DFEATURE_sql_odbc=OFF `
          -DFEATURE_sql_sqlite=OFF `
          -DMySQL_INCLUDE_DIR="C:\mysql_libs\include" `
          -DMySQL_LIBRARY="C:\mysql_libs\libmariadb.lib" `
          2>&1 | Tee-Object -Variable cmakeOutput
        
        Write-Host "=== cmake exit code: $LASTEXITCODE ==="
        
        # Afficher le config.summary
        Write-Host "=== config.summary ==="
        if (Test-Path "config.summary") {
            Get-Content "config.summary"
        } else {
            Write-Host "No config.summary found"
        }
        
        # Vérifier dans CMakeCache que MySQL est ON
        Write-Host "=== CMakeCache MySQL/SQL entries ==="
        Select-String -Path "CMakeCache.txt" -Pattern "mysql|FEATURE_sql" -CaseSensitive:$false
        
        # Vérification critique : MySQL doit être ON
        $mysqlFeature = Select-String -Path "CMakeCache.txt" -Pattern "FEATURE_sql_mysql" | Select-Object -First 1
        Write-Host "MySQL feature line: $mysqlFeature"
        if ($mysqlFeature -match "OFF") {
            Write-Error "FATAL: FEATURE_sql_mysql is OFF! CMake did not detect MySQL properly."
            Write-Host "=== Full CMakeCache ==="
            Get-Content "CMakeCache.txt"
            exit 1
        }
        
        # Compiler
        Write-Host "=== Building ==="
        cmake --build . --verbose 2>&1 | Tee-Object -Variable buildOutput
        Write-Host "=== Build exit code: $LASTEXITCODE ==="
        
        # Vérifier le résultat
        Write-Host "=== All DLLs produced ==="
        Get-ChildItem -Recurse -Filter "*.dll" | Select-Object FullName
        
        $plugin = Get-ChildItem -Recurse -Filter "qsqlmysql.dll" | Select-Object -First 1
        if (-not $plugin) {
            Write-Error "FATAL: qsqlmysql.dll was NOT produced!"
            Write-Host "=== Full build tree ==="
            Get-ChildItem -Recurse | Select-Object FullName
            exit 1
        }
        Write-Host "SUCCESS: $($plugin.FullName)"

    - name: Build Application
      shell: cmd
      env:
        QT_PATH: C:\qt\6.8.0\msvc2022_64
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        set PATH=%QT_PATH%\bin;%PATH%
        
        mkdir build
        cd build
        
        qmake ..\LiveBridge.pro "CONFIG+=release"
        nmake

    - name: Package Application
      shell: pwsh
      env:
        QT_BIN: C:\qt\6.8.0\msvc2022_64\bin
      run: |
        New-Item -ItemType Directory -Force -Path "ReleasePack"
        
        Copy-Item "build\release\LiveBridge.exe" "ReleasePack\"
        Copy-Item "C:\mysql_libs\libmariadb.dll" "ReleasePack\"
        
        & "$env:QT_BIN\windeployqt.exe" --dir "ReleasePack" --plugindir "ReleasePack\plugins" --no-translations --compiler-runtime "ReleasePack\LiveBridge.exe"
        
        # Copie du plugin QMYSQL
        $plugin = Get-ChildItem -Path "build-sqldrivers" -Filter "qsqlmysql.dll" -Recurse | Select-Object -First 1
        if ($plugin) {
            Write-Host "FOUND: $($plugin.FullName)"
            $targetDir = "ReleasePack\plugins\sqldrivers"
            New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
            Copy-Item $plugin.FullName "$targetDir\" -Force
        } else {
            Write-Error "CRITICAL: qsqlmysql.dll not found!"
            exit 1
        }
        
        Write-Host "=== Final ReleasePack ==="
        Get-ChildItem -Recurse "ReleasePack" | Select-Object FullName

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LiveBridge-Portable-Windows
        path: ReleasePack