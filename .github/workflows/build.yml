name: Windows Build (Portable)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
    # 1. Récupération du code
    - uses: actions/checkout@v4

    # 2. Installation de Python
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 3. Installation de Qt 6.8 ET des Sources
    - name: Install Qt & Sources via aqtinstall
      shell: pwsh
      run: |
        pip install aqtinstall
        aqt install-qt windows desktop 6.8.0 win64_msvc2022_64 -m qtwebsockets --outputdir c:\qt
        aqt install-src windows desktop 6.8.0 --outputdir c:\qt

    # 4. Téléchargement des librairies MariaDB
    - name: Download MariaDB Connector C
      shell: pwsh
      run: |
        $url = "https://downloads.mariadb.com/Connectors/c/connector-c-3.3.8/mariadb-connector-c-3.3.8-win64.msi"
        Invoke-WebRequest -Uri $url -OutFile mariadb.msi
        Start-Process msiexec.exe -ArgumentList '/i', 'mariadb.msi', '/quiet', '/norestart' -NoNewWindow -Wait
        
        New-Item -ItemType Directory -Force -Path "C:\mysql_libs"
        New-Item -ItemType Directory -Force -Path "C:\mysql_libs\include"
        
        # Copie lib
        Copy-Item "C:\Program Files\MariaDB\MariaDB Connector C 64-bit\lib\libmariadb.lib" "C:\mysql_libs\"
        Copy-Item "C:\Program Files\MariaDB\MariaDB Connector C 64-bit\lib\libmariadb.dll" "C:\mysql_libs\"
        
        # Copie TOUS les headers à plat dans include/
        Copy-Item "C:\Program Files\MariaDB\MariaDB Connector C 64-bit\include\*.h" "C:\mysql_libs\include\"
        # Plus les sous-dossiers mariadb/ et mysql/
        if (Test-Path "C:\Program Files\MariaDB\MariaDB Connector C 64-bit\include\mariadb") {
            Copy-Item "C:\Program Files\MariaDB\MariaDB Connector C 64-bit\include\mariadb\*.h" "C:\mysql_libs\include\" -ErrorAction SilentlyContinue
        }
        if (Test-Path "C:\Program Files\MariaDB\MariaDB Connector C 64-bit\include\mysql") {
            Copy-Item "C:\Program Files\MariaDB\MariaDB Connector C 64-bit\include\mysql\*.h" "C:\mysql_libs\include\" -ErrorAction SilentlyContinue
        }
        
        # Vérification
        Write-Host "=== Include dir contents ==="
        Get-ChildItem "C:\mysql_libs\include\mysql.h"
        Write-Host "=== Lib dir contents ==="
        Get-ChildItem "C:\mysql_libs\libmariadb.*"

    # 5. Compilation du Plugin QMYSQL
    - name: Compile QMYSQL Plugin
      shell: cmd
      env:
        QT_PATH: C:\qt\6.8.0\msvc2022_64
        SRC_PATH: C:\qt\6.8.0\Src
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        
        mkdir build-sqldrivers
        cd build-sqldrivers
        
        echo "=== Running qt-cmake ==="
        %QT_PATH%\bin\qt-cmake.bat "%SRC_PATH%\qtbase\src\plugins\sqldrivers" ^
          -G "Ninja" ^
          -DCMAKE_INSTALL_PREFIX="%QT_PATH%" ^
          -DFEATURE_sql_mysql=ON ^
          -DMySQL_INCLUDE_DIR="C:\mysql_libs\include" ^
          -DMySQL_LIBRARY="C:\mysql_libs\libmariadb.lib"
        
        echo "=== config.summary ==="
        type config.summary
        
        echo "=== CMakeCache MySQL entries ==="
        findstr /i "mysql" CMakeCache.txt
        findstr /i "FEATURE_sql" CMakeCache.txt
        
        echo "=== Building ==="
        cmake --build . --verbose 2>&1
        
        echo "=== Build complete, listing all DLLs ==="
        dir /s /b *.dll
        
        echo "=== Checking for qsqlmysql.dll ==="
        dir /s /b qsqlmysql.dll
        if errorlevel 1 (
            echo "FATAL: qsqlmysql.dll was NOT produced!"
            echo "=== Full build tree ==="
            dir /s /b .
            exit /b 1
        )
        echo "SUCCESS: qsqlmysql.dll compiled."

    # 6. Compilation de l'application
    - name: Build Application
      shell: cmd
      env:
        QT_PATH: C:\qt\6.8.0\msvc2022_64
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        set PATH=%QT_PATH%\bin;%PATH%
        
        mkdir build
        cd build
        
        qmake ..\LiveBridge.pro "CONFIG+=release"
        nmake

    # 7. Déploiement
    - name: Package Application
      shell: pwsh
      env:
        QT_BIN: C:\qt\6.8.0\msvc2022_64\bin
      run: |
        New-Item -ItemType Directory -Force -Path "ReleasePack"
        
        # 1. Copie App & DLL MariaDB
        Copy-Item "build\release\LiveBridge.exe" "ReleasePack\"
        Copy-Item "C:\mysql_libs\libmariadb.dll" "ReleasePack\"
        
        # 2. Windeployqt
        & "$env:QT_BIN\windeployqt.exe" --dir "ReleasePack" --plugindir "ReleasePack\plugins" --no-translations --compiler-runtime "ReleasePack\LiveBridge.exe"
        
        # 3. Copie du plugin QMYSQL compilé
        Write-Host "=== Searching for qsqlmysql.dll ==="
        $plugin = Get-ChildItem -Path "build-sqldrivers" -Filter "qsqlmysql.dll" -Recurse | Select-Object -First 1
        
        if ($plugin) {
            Write-Host "FOUND: $($plugin.FullName)"
            $targetDir = "ReleasePack\plugins\sqldrivers"
            if (-not (Test-Path $targetDir)) {
                New-Item -ItemType Directory -Force -Path $targetDir
            }
            Copy-Item $plugin.FullName "$targetDir\" -Force
        } else {
            Write-Error "CRITICAL: qsqlmysql.dll not found!"
            exit 1
        }
        
        # 4. Listing final
        Write-Host "=== Final ReleasePack ==="
        Get-ChildItem -Recurse "ReleasePack" | Select-Object FullName

    # 8. Upload
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LiveBridge-Portable-Windows
        path: ReleasePack